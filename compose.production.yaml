name: itss-industry

x-backend-service: &backend-service
  image: itss-industry-backend:local
  build:
    context: ./backend
    dockerfile: Dockerfile
  env_file:
    - ${INDUSTRY_ENV_FILE:-./backend/.env.production}
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - industry_backend

x-service-logging: &service-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - ${INDUSTRY_ENV_FILE:-./backend/.env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 60s
    logging: *service-logging
    networks:
      - industry_backend

  migrate:
    <<: *backend-service
    profiles: ["maintenance"]
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    logging: *service-logging

  api:
    <<: *backend-service
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${INDUSTRY_API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    logging: *service-logging

volumes:
  postgres_data:

networks:
  industry_backend:
    driver: bridge
