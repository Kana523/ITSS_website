name: SDE Recipe Audit

on:
  push:
    branches: [indy-calc]
    paths:
      - ".github/workflows/sde-recipe-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan latest CCP SDE
        shell: python
        run: |
          import io, json, os, urllib.request, zipfile
          from pathlib import Path, PurePosixPath

          url = "https://developers.eveonline.com/static-data/eve-online-static-data-latest-jsonl.zip"
          with urllib.request.urlopen(url, timeout=120) as response:
              payload = response.read()
              resolved_url = response.geturl()

          with zipfile.ZipFile(io.BytesIO(payload)) as archive:
              members = {PurePosixPath(n).name: n for n in archive.namelist()}
              types = {}
              with archive.open(members["types.jsonl"]) as stream:
                  for raw in stream:
                      row = json.loads(raw)
                      name = row.get("name")
                      if isinstance(name, dict):
                          name = name.get("en")
                      types[row["_key"]] = {
                          "name": name if isinstance(name, str) else None,
                          "published": row.get("published") is True,
                      }

              build_number = None
              if "_sde.jsonl" in members:
                  with archive.open(members["_sde.jsonl"]) as stream:
                      for raw in stream:
                          row = json.loads(raw)
                          if row.get("_key") == "sde":
                              value = row.get("_value", row)
                              if isinstance(value, dict):
                                  build_number = value.get("buildNumber")
                              break

              activities = ("manufacturing", "reaction")
              all_counts = {a: {"recipes": 0, "multi_product": 0, "self_dependent": 0, "identity_self_dependent": 0} for a in activities}
              imported_counts = {a: {"recipes": 0, "multi_product": 0, "self_dependent": 0, "identity_self_dependent": 0} for a in activities}
              multi_product = []
              self_dependent = []
              imported_non_identity = []

              with archive.open(members["blueprints.jsonl"]) as stream:
                  for raw in stream:
                      row = json.loads(raw)
                      bp_id = row["_key"]
                      bp = types.get(bp_id, {"name": None, "published": False})
                      for activity_name in activities:
                          activity = row.get("activities", {}).get(activity_name)
                          if not isinstance(activity, dict):
                              continue
                          all_counts[activity_name]["recipes"] += 1
                          if bp["published"]:
                              imported_counts[activity_name]["recipes"] += 1

                          products = activity.get("products", []) or []
                          materials = activity.get("materials", []) or []
                          if len(products) > 1:
                              all_counts[activity_name]["multi_product"] += 1
                              if bp["published"]:
                                  imported_counts[activity_name]["multi_product"] += 1
                              multi_product.append({"activity": activity_name, "blueprint_type_id": bp_id, "blueprint_name": bp["name"], "blueprint_published": bp["published"]})

                          product_ids = {x["typeID"] for x in products}
                          material_ids = {x["typeID"] for x in materials}
                          shared = sorted(product_ids & material_ids)
                          if not shared:
                              continue

                          identity = (
                              len(materials) == 1
                              and len(products) == 1
                              and materials[0]["typeID"] == products[0]["typeID"]
                              and materials[0]["quantity"] == products[0]["quantity"]
                          )
                          all_counts[activity_name]["self_dependent"] += 1
                          if identity:
                              all_counts[activity_name]["identity_self_dependent"] += 1
                          if bp["published"]:
                              imported_counts[activity_name]["self_dependent"] += 1
                              if identity:
                                  imported_counts[activity_name]["identity_self_dependent"] += 1

                          detail = {
                              "activity": activity_name,
                              "blueprint_type_id": bp_id,
                              "blueprint_name": bp["name"],
                              "blueprint_published": bp["published"],
                              "identity_recipe": identity,
                              "materials": [{**x, "name": types.get(x["typeID"], {}).get("name")} for x in materials],
                              "products": [{**x, "name": types.get(x["typeID"], {}).get("name")} for x in products],
                          }
                          self_dependent.append(detail)
                          if bp["published"] and not identity:
                              imported_non_identity.append(detail)

          result = {
              "source_url": resolved_url,
              "build_number": build_number,
              "all_sde_counts": all_counts,
              "calculator_import_counts": imported_counts,
              "multi_product_recipes": multi_product,
              "calculator_non_identity_self_dependent_recipes": imported_non_identity,
              "self_dependent_recipes": self_dependent,
          }
          out = Path(".github/audits/sde-recipe-audit.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(result, indent=2, sort_keys=True))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("## SDE recipe audit\n\n```json\n" + json.dumps(result, indent=2, sort_keys=True) + "\n```\n")

      - name: Persist audit result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/audits/sde-recipe-audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record live SDE recipe audit"
          git push
