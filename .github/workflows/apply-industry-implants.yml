name: Apply Industry Implants

on:
  push:
    branches: [indy-calc]
    paths:
      - ".github/workflows/apply-industry-implants.yml"
  pull_request_target:
    branches: [indy-calc]
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: industry
          POSTGRES_USER: industry
          POSTGRES_PASSWORD: industry-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U industry -d industry"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      POSTGRES_DB: industry
      POSTGRES_USER: industry
      POSTGRES_PASSWORD: industry-test-password
      DATABASE_URL: postgresql+psycopg://industry:industry-test-password@127.0.0.1:5432/industry
      ESI_USER_AGENT: ITSS-Industry-CI/1.0
      ESI_COMPATIBILITY_DATE: "2026-08-13"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: indy-calc
      - name: Apply implant patch
        run: python .github/scripts/apply_industry_implants.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        working-directory: backend
        run: uv sync --locked --dev
      - name: Check migrations
        working-directory: backend
        run: uv run alembic upgrade head
      - name: Run complete backend suite
        working-directory: backend
        run: uv run pytest -ra
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/industry/models.py backend/app/industry/planner.py backend/app/api/schemas/industry.py backend/tests/test_industry_implants.py industry/index.html assets/js/industry.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add manufacturing time implants"
          git push origin HEAD:indy-calc
