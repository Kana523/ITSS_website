name: Apply Industry Implants

on:
  push:
    branches: [indy-calc]
    paths:
      - ".github/workflows/apply-industry-implants.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: industry
          POSTGRES_USER: industry
          POSTGRES_PASSWORD: industry-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U industry -d industry"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      POSTGRES_DB: industry
      POSTGRES_USER: industry
      POSTGRES_PASSWORD: industry-test-password
      DATABASE_URL: postgresql+psycopg://industry:industry-test-password@127.0.0.1:5432/industry
      ESI_USER_AGENT: ITSS-Industry-CI/1.0
      ESI_COMPATIBILITY_DATE: "2026-08-13"
    steps:
      - uses: actions/checkout@v4

      - name: Patch implant support
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected patch target not found in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Domain model: known current manufacturing-time hardwirings.
          replace_once(
              "backend/app/industry/models.py",
              "from enum import StrEnum\n",
              "from enum import IntEnum, StrEnum\n",
          )
          replace_once(
              "backend/app/industry/models.py",
              '''class ActivityKind(StrEnum):\n    MANUFACTURING = "manufacturing"\n    REACTION = "reaction"\n\n\nclass BuildDecision(StrEnum):\n''',
              '''class ActivityKind(StrEnum):\n    MANUFACTURING = "manufacturing"\n    REACTION = "reaction"\n\n\nclass ManufacturingTimeImplant(IntEnum):\n    """Supported slot-8 hardwirings that reduce manufacturing duration."""\n\n    BX_801 = 27170\n    BX_802 = 27167\n    BX_804 = 27171\n\n    @property\n    def time_reduction_basis_points(self) -> int:\n        return {\n            ManufacturingTimeImplant.BX_801: 100,\n            ManufacturingTimeImplant.BX_802: 200,\n            ManufacturingTimeImplant.BX_804: 400,\n        }[self]\n\n\nclass BuildDecision(StrEnum):\n''',
          )
          replace_once(
              "backend/app/industry/models.py",
              '''    skills: CharacterIndustrySkills = field(\n        default_factory=CharacterIndustrySkills\n    )\n    facility_modifiers: tuple[FacilityModifier, ...] = ()\n''',
              '''    skills: CharacterIndustrySkills = field(\n        default_factory=CharacterIndustrySkills\n    )\n    manufacturing_time_implant: ManufacturingTimeImplant | None = None\n    facility_modifiers: tuple[FacilityModifier, ...] = ()\n''',
          )
          replace_once(
              "backend/app/industry/models.py",
              '''        if not isinstance(self.skills, CharacterIndustrySkills):\n            raise InvalidIndustryDataError(\n                "production profile skills must be CharacterIndustrySkills"\n            )\n        if not isinstance(self.facility_modifiers, tuple):\n''',
              '''        if not isinstance(self.skills, CharacterIndustrySkills):\n            raise InvalidIndustryDataError(\n                "production profile skills must be CharacterIndustrySkills"\n            )\n        if (\n            self.manufacturing_time_implant is not None\n            and not isinstance(\n                self.manufacturing_time_implant, ManufacturingTimeImplant\n            )\n        ):\n            raise InvalidIndustryDataError(\n                "manufacturing_time_implant must be a supported "\n                "ManufacturingTimeImplant"\n            )\n        if not isinstance(self.facility_modifiers, tuple):\n''',
          )
          replace_once(
              "backend/app/industry/models.py",
              '''    activity: ActivityKind\n    skills: CharacterIndustrySkills\n    facility_material_reduction_basis_points: int = 0\n''',
              '''    activity: ActivityKind\n    skills: CharacterIndustrySkills\n    manufacturing_time_implant: ManufacturingTimeImplant | None = None\n    facility_material_reduction_basis_points: int = 0\n''',
          )
          replace_once(
              "backend/app/industry/models.py",
              '''        if not isinstance(self.skills, CharacterIndustrySkills):\n            raise InvalidIndustryDataError(\n                "applied modifier skills must be CharacterIndustrySkills"\n            )\n        for field_name in (\n''',
              '''        if not isinstance(self.skills, CharacterIndustrySkills):\n            raise InvalidIndustryDataError(\n                "applied modifier skills must be CharacterIndustrySkills"\n            )\n        if (\n            self.manufacturing_time_implant is not None\n            and not isinstance(\n                self.manufacturing_time_implant, ManufacturingTimeImplant\n            )\n        ):\n            raise InvalidIndustryDataError(\n                "applied manufacturing_time_implant must be a supported "\n                "ManufacturingTimeImplant"\n            )\n        for field_name in (\n''',
          )
          replace_once(
              "backend/app/industry/models.py",
              '''    @property\n    def facility_material_multiplier(self) -> Fraction:\n''',
              '''    @property\n    def implant_time_multiplier(self) -> Fraction:\n        if (\n            self.activity != ActivityKind.MANUFACTURING\n            or self.manufacturing_time_implant is None\n        ):\n            return Fraction(1)\n        return _reduction_factor(\n            self.manufacturing_time_implant.time_reduction_basis_points\n        )\n\n    @property\n    def facility_material_multiplier(self) -> Fraction:\n''',
          )
          replace_once(
              "backend/app/industry/models.py",
              '''        return (\n            self.character_time_multiplier\n            * self.facility_time_multiplier\n            * self.rig_time_multiplier\n        )\n''',
              '''        return (\n            self.character_time_multiplier\n            * self.implant_time_multiplier\n            * self.facility_time_multiplier\n            * self.rig_time_multiplier\n        )\n''',
          )

          # Planner: carry the request-scoped implant into each resolved step.
          replace_once(
              "backend/app/industry/planner.py",
              '''    return AppliedProductionModifiers(\n        activity=recipe.activity,\n        skills=production_profile.skills,\n        facility_material_reduction_basis_points=(\n''',
              '''    return AppliedProductionModifiers(\n        activity=recipe.activity,\n        skills=production_profile.skills,\n        manufacturing_time_implant=production_profile.manufacturing_time_implant,\n        facility_material_reduction_basis_points=(\n''',
          )

          # API: additive optional implant type ID and applied-modifier reporting.
          replace_once(
              "backend/app/api/schemas/industry.py",
              '''    MAX_REDUCTION_BASIS_POINTS,\n    MAX_SAFE_INTEGER,\n    ProductionProfile,\n''',
              '''    MAX_REDUCTION_BASIS_POINTS,\n    MAX_SAFE_INTEGER,\n    ManufacturingTimeImplant,\n    ProductionProfile,\n''',
          )
          replace_once(
              "backend/app/api/schemas/industry.py",
              '''    reactions_level: SkillLevel = 0\n    facility_modifiers: Annotated[\n''',
              '''    reactions_level: SkillLevel = 0\n    manufacturing_time_implant: ManufacturingTimeImplant | None = None\n    facility_modifiers: Annotated[\n''',
          )
          replace_once(
              "backend/app/api/schemas/industry.py",
              '''            skills=CharacterIndustrySkills(\n                industry_level=self.industry_level,\n                advanced_industry_level=self.advanced_industry_level,\n                reactions_level=self.reactions_level,\n            ),\n            facility_modifiers=tuple(\n''',
              '''            skills=CharacterIndustrySkills(\n                industry_level=self.industry_level,\n                advanced_industry_level=self.advanced_industry_level,\n                reactions_level=self.reactions_level,\n            ),\n            manufacturing_time_implant=self.manufacturing_time_implant,\n            facility_modifiers=tuple(\n''',
          )
          replace_once(
              "backend/app/api/schemas/industry.py",
              '''            "advanced_industry_skill_time",\n            "reactions_skill_time",\n            "facility_material_efficiency",\n''',
              '''            "advanced_industry_skill_time",\n            "reactions_skill_time",\n            "manufacturing_implant_time",\n            "facility_material_efficiency",\n''',
          )
          replace_once(
              "backend/app/api/schemas/industry.py",
              '''            "advanced_industry_skill_time",\n            "reactions_skill_time",\n            "facility_material_efficiency",\n''',
              '''            "advanced_industry_skill_time",\n            "reactions_skill_time",\n            "manufacturing_implant_time",\n            "facility_material_efficiency",\n''',
          )
          replace_once(
              "backend/app/api/schemas/industry.py",
              '''    if any(\n        step.recipe.activity == ActivityKind.REACTION\n        and step.production_modifiers.skills.reactions_level > 0\n        for step in plan.build_steps\n    ):\n        applied_modifiers.append("reactions_skill_time")\n    if any(\n        step.production_modifiers\n''',
              '''    if any(\n        step.recipe.activity == ActivityKind.REACTION\n        and step.production_modifiers.skills.reactions_level > 0\n        for step in plan.build_steps\n    ):\n        applied_modifiers.append("reactions_skill_time")\n    if any(\n        step.recipe.activity == ActivityKind.MANUFACTURING\n        and step.production_modifiers.manufacturing_time_implant is not None\n        for step in plan.build_steps\n    ):\n        applied_modifiers.append("manufacturing_implant_time")\n    if any(\n        step.production_modifiers\n''',
          )
          replace_once(
              "backend/app/api/schemas/industry.py",
              '''        excluded_modifiers=(\n            "character_implants",\n            "owned_materials",\n            *(() if result.valuation is not None else ("market_prices",)),\n        ),\n''',
              '''        excluded_modifiers=(\n            "owned_materials",\n            *(() if result.valuation is not None else ("market_prices",)),\n        ),\n''',
          )

          # Functional UI: select the actual hardwiring by type ID.
          replace_once(
              "industry/index.html",
              '''                  <label>\n                    <span>Reactions</span>\n                    <select data-profile-skill="reactions_level" aria-label="Reactions skill level">\n                      <option value="0">0</option><option value="1">1</option><option value="2">2</option>\n                      <option value="3">3</option><option value="4">4</option><option value="5">5</option>\n                    </select>\n                  </label>\n                </div>\n              </fieldset>\n''',
              '''                  <label>\n                    <span>Reactions</span>\n                    <select data-profile-skill="reactions_level" aria-label="Reactions skill level">\n                      <option value="0">0</option><option value="1">1</option><option value="2">2</option>\n                      <option value="3">3</option><option value="4">4</option><option value="5">5</option>\n                    </select>\n                  </label>\n                  <label>\n                    <span>Manufacturing implant</span>\n                    <select data-profile-implant="manufacturing_time_implant" aria-label="Manufacturing time implant">\n                      <option value="">None</option>\n                      <option value="27170">BX-801 · 1%</option>\n                      <option value="27167">BX-802 · 2%</option>\n                      <option value="27171">BX-804 · 4%</option>\n                    </select>\n                  </label>\n                </div>\n                <p class="field-help">The Zainou Beancounter BX hardwirings use implant slot 8 and reduce manufacturing job time only.</p>\n              </fieldset>\n''',
          )
          replace_once(
              "industry/index.html",
              '''          <p>Blueprint, skill, facility, and rig modifiers are applied to each combined job with exact arithmetic. Cached market prices are estimates; owned materials are not deducted yet.</p>\n''',
              '''          <p>Blueprint, skill, implant, facility, and rig modifiers are applied to each combined job with exact arithmetic. Cached market prices are estimates.</p>\n''',
          )

          # Browser request wiring and profile summary.
          replace_once(
              "assets/js/industry.js",
              '''      reactions_level: Number(app.querySelector('[data-profile-skill="reactions_level"]').value),\n      facility_modifiers: [],\n''',
              '''      reactions_level: Number(app.querySelector('[data-profile-skill="reactions_level"]').value),\n      manufacturing_time_implant: (() => {\n        const value = app.querySelector('[data-profile-implant="manufacturing_time_implant"]').value;\n        return value ? Number(value) : null;\n      })(),\n      facility_modifiers: [],\n''',
          )
          replace_once(
              "assets/js/industry.js",
              '''      || profile.reactions_level > 0\n      || profile.facility_modifiers.length > 0\n''',
              '''      || profile.reactions_level > 0\n      || profile.manufacturing_time_implant !== null\n      || profile.facility_modifiers.length > 0\n''',
          )
          replace_once(
              "assets/js/industry.js",
              '''    const hasModifier = [...app.querySelectorAll("[data-profile-modifier]")]\n      .some((input) => Number(input.value) > 0);\n    const hasScope = [...app.querySelectorAll("[data-rig-scope]")]\n''',
              '''    const hasImplant = [...app.querySelectorAll("[data-profile-implant]")]\n      .some((input) => input.value.trim().length > 0);\n    const hasModifier = [...app.querySelectorAll("[data-profile-modifier]")]\n      .some((input) => Number(input.value) > 0);\n    const hasScope = [...app.querySelectorAll("[data-rig-scope]")]\n''',
          )
          replace_once(
              "assets/js/industry.js",
              '''    elements.profileSummary.textContent = hasSkill || hasModifier || hasScope\n''',
              '''    elements.profileSummary.textContent = hasSkill || hasImplant || hasModifier || hasScope\n''',
          )
          replace_once(
              "assets/js/industry.js",
              '''  app.querySelectorAll("[data-profile-skill], [data-profile-modifier], [data-rig-scope]")\n''',
              '''  app.querySelectorAll("[data-profile-skill], [data-profile-implant], [data-profile-modifier], [data-rig-scope]")\n''',
          )

          # Regression coverage: domain, API validation/effect, reaction isolation, UI wiring.
          Path("backend/tests/test_industry_implants.py").write_text(
              '''from fractions import Fraction\nfrom pathlib import Path\n\nimport pytest\nfrom fastapi.testclient import TestClient\n\nfrom app.industry.models import (\n    ActivityKind,\n    IndustryRecipe,\n    ItemQuantity,\n    ManufacturingTimeImplant,\n    ProductionProfile,\n    RecipeKey,\n)\nfrom app.industry.planner import plan_production\n\n\ndef _recipe(activity: ActivityKind = ActivityKind.MANUFACTURING) -> IndustryRecipe:\n    return IndustryRecipe(\n        key=RecipeKey(9001, 1 if activity == ActivityKind.MANUFACTURING else 9),\n        blueprint_name="Implant Test Blueprint",\n        activity=activity,\n        time_seconds=100,\n        max_production_limit=100,\n        products=(ItemQuantity(8001, 1),),\n        materials=(ItemQuantity(7001, 10),),\n    )\n\n\n@pytest.mark.parametrize(\n    ("implant", "expected_multiplier"),\n    [\n        (ManufacturingTimeImplant.BX_801, Fraction(99, 100)),\n        (ManufacturingTimeImplant.BX_802, Fraction(49, 50)),\n        (ManufacturingTimeImplant.BX_804, Fraction(24, 25)),\n    ],\n)\ndef test_manufacturing_implants_apply_exact_time_reduction(implant, expected_multiplier) -> None:\n    recipe = _recipe()\n    plan = plan_production(\n        (ItemQuantity(8001, 1),),\n        (recipe,),\n        sde_build_number=1,\n        production_profile=ProductionProfile(manufacturing_time_implant=implant),\n    )\n\n    step = plan.build_steps[0]\n    assert step.production_modifiers.implant_time_multiplier == expected_multiplier\n    assert step.exact_job_time_seconds == Fraction(100) * expected_multiplier\n    assert step.inputs == (ItemQuantity(7001, 10),)\n\n\ndef test_manufacturing_implant_does_not_affect_reactions() -> None:\n    recipe = _recipe(ActivityKind.REACTION)\n    plan = plan_production(\n        (ItemQuantity(8001, 1),),\n        (recipe,),\n        sde_build_number=1,\n        production_profile=ProductionProfile(\n            manufacturing_time_implant=ManufacturingTimeImplant.BX_804\n        ),\n    )\n\n    step = plan.build_steps[0]\n    assert step.production_modifiers.implant_time_multiplier == 1\n    assert step.exact_job_time_seconds == 100\n\n\ndef test_api_applies_bx_804_by_type_id(api_client: TestClient) -> None:\n    response = api_client.post(\n        "/api/industry/calculate",\n        json={\n            "demands": [{"type_id": 1003, "quantity": 3}],\n            "choices": [{"type_id": 1002, "decision": "buy"}],\n            "production_profile": {"manufacturing_time_implant": 27171},\n        },\n    )\n\n    assert response.status_code == 200\n    body = response.json()\n    assert body["applied_modifiers"] == ["manufacturing_implant_time"]\n    step = body["build_steps"][0]\n    assert Fraction(\n        int(step["exact_job_time_seconds"]["numerator"]),\n        int(step["exact_job_time_seconds"]["denominator"]),\n    ) == Fraction(186) * Fraction(24, 25)\n    assert step["inputs"][0]["total_quantity"] == 12\n    assert "character_implants" not in body["excluded_modifiers"]\n\n\ndef test_api_rejects_unknown_manufacturing_implant(api_client: TestClient) -> None:\n    response = api_client.post(\n        "/api/industry/calculate",\n        json={\n            "demands": [{"type_id": 1003, "quantity": 1}],\n            "production_profile": {"manufacturing_time_implant": 999999},\n        },\n    )\n\n    assert response.status_code == 422\n    assert response.json()["error"]["code"] == "validation_error"\n\n\ndef test_frontend_exposes_all_supported_bx_implants_and_sends_profile_field() -> None:\n    repository_root = Path(__file__).resolve().parents[2]\n    html = (repository_root / "industry" / "index.html").read_text(encoding="utf-8")\n    javascript = (repository_root / "assets" / "js" / "industry.js").read_text(encoding="utf-8")\n\n    assert 'data-profile-implant="manufacturing_time_implant"' in html\n    assert '<option value="27170">BX-801 · 1%</option>' in html\n    assert '<option value="27167">BX-802 · 2%</option>' in html\n    assert '<option value="27171">BX-804 · 4%</option>' in html\n    assert 'manufacturing_time_implant:' in javascript\n    assert '[data-profile-implant="manufacturing_time_implant"]' in javascript\n''',
              encoding="utf-8",
          )

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        working-directory: backend
        run: uv sync --locked --dev
      - name: Check migrations
        working-directory: backend
        run: uv run alembic upgrade head
      - name: Run complete backend suite
        working-directory: backend
        run: uv run pytest -ra
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/industry/models.py backend/app/industry/planner.py backend/app/api/schemas/industry.py backend/tests/test_industry_implants.py industry/index.html assets/js/industry.js
          git commit -m "Add manufacturing time implants"
          git push
