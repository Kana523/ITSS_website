name: Verify Backend Full Suite

on:
  push:
    branches: [indy-calc]
    paths:
      - ".github/workflows/verify-backend-full.yml"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: industry
          POSTGRES_USER: industry
          POSTGRES_PASSWORD: industry-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U industry -d industry"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      POSTGRES_DB: industry
      POSTGRES_USER: industry
      POSTGRES_PASSWORD: industry-test-password
      DATABASE_URL: postgresql+psycopg://industry:industry-test-password@127.0.0.1:5432/industry
      ESI_USER_AGENT: ITSS-Industry-CI/1.0
      ESI_COMPATIBILITY_DATE: "2026-08-13"
    steps:
      - uses: actions/checkout@v4

      - name: Update legacy self-dependent API expectation
        shell: python
        run: |
          from pathlib import Path
          path = Path("backend/tests/test_industry_api.py")
          text = path.read_text(encoding="utf-8")
          old = '''def test_cycle_error_is_structured(api_client: TestClient) -> None:\n    response = api_client.post(\n        "/api/industry/calculate",\n        json={"demands": [{"type_id": 1004, "quantity": 1}]},\n    )\n\n    assert response.status_code == 409\n    assert response.json()["error"]["code"] == "recipe_cycle"\n    assert response.json()["error"]["details"]["type_path"] == [1004, 1004]\n    assert response.json()["sde_build_number"] == 9_000_001\n'''
          new = '''def test_self_dependent_recipe_error_is_structured(api_client: TestClient) -> None:\n    response = api_client.post(\n        "/api/industry/calculate",\n        json={"demands": [{"type_id": 1004, "quantity": 1}]},\n    )\n\n    assert response.status_code == 409\n    assert response.json()["error"]["code"] == "unsupported_self_dependent_recipe"\n    assert response.json()["error"]["details"] == {\n        "product_type_id": 1004,\n        "recipe_key": {"blueprint_type_id": 2004, "activity_id": 1},\n    }\n    assert response.json()["sde_build_number"] == 9_000_001\n'''
          if old not in text:
              raise SystemExit("Expected legacy cycle test block not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        working-directory: backend
        run: uv sync --locked --dev
      - name: Check migrations
        working-directory: backend
        run: uv run alembic upgrade head
      - name: Run complete test suite
        id: pytest
        working-directory: backend
        shell: bash
        run: |
          set +e
          uv run pytest -ra 2>&1 | tee pytest-output.txt
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Record verification result and contract update
        if: always()
        shell: bash
        run: |
          status="${{ steps.pytest.outputs.status }}"
          if [ "$status" = "0" ]; then result=PASS; else result=FAIL; fi
          printf '%s\n' "$result" > .github/full-ci-result.txt
          tail -n 80 backend/pytest-output.txt >> .github/full-ci-result.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/tests/test_industry_api.py .github/full-ci-result.txt
          git commit -m "Align API test with legacy recipe rejection"
          git push
          exit "${status:-1}"
