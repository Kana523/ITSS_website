name: Backend CI

on:
  push:
    branches: [main, indy-calc, develop]
    paths:
      - "backend/**"
      - "compose.production.yaml"
      - "deploy/oracle/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "compose.production.yaml"
      - "deploy/oracle/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: industry
          POSTGRES_USER: industry
          POSTGRES_PASSWORD: industry-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U industry -d industry"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      POSTGRES_DB: industry
      POSTGRES_USER: industry
      POSTGRES_PASSWORD: industry-test-password
      DATABASE_URL: postgresql+psycopg://industry:industry-test-password@127.0.0.1:5432/industry
      ESI_USER_AGENT: ITSS-Industry-CI/1.0
      ESI_COMPATIBILITY_DATE: "2026-08-13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        working-directory: backend
        run: uv sync --locked --dev
      - name: Check migrations
        working-directory: backend
        run: uv run alembic upgrade head
      - name: Validate production Compose configuration
        env:
          INDUSTRY_ENV_FILE: ./backend/.env.production.example
        run: docker compose -f compose.production.yaml config -q
      - name: Build production backend image
        env:
          INDUSTRY_ENV_FILE: ./backend/.env.production.example
        run: docker compose -f compose.production.yaml build api migrate
      - name: Run complete test suite
        id: pytest
        working-directory: backend
        shell: bash
        run: |
          set +e
          uv run pytest -ra --junitxml=pytest-results.xml 2>&1 | tee pytest-output.txt
          status=${PIPESTATUS[0]}
          {
            echo "## Pytest output"
            echo '```text'
            tail -n 200 pytest-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload pytest results
        if: always() && steps.pytest.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: |
            backend/pytest-results.xml
            backend/pytest-output.txt
          if-no-files-found: error
          retention-days: 7
      - name: Enforce pytest result
        if: always() && steps.pytest.outcome != 'skipped'
        shell: bash
        run: exit "${{ steps.pytest.outputs.status }}"
